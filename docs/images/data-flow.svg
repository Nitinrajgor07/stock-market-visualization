<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="12" fill="url(#seqBg)"/>
  <rect x="1" y="1" width="998" height="518" rx="11" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Trade Execution &amp; Telegram Bot Sync Sequence</text>
  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">End-to-end data lifecycle from order placement in Streamlit to mobile Telegram response</text>

  <!-- Participants -->
  <g transform="translate(40, 80)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
    <!-- P1: User -->
    <rect x="0" y="0" width="110" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="55" y="22" text-anchor="middle">User / Browser</text>
    <line x1="55" y1="34" x2="55" y2="400" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- P2: Streamlit App -->
    <rect x="160" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="225" y="22" text-anchor="middle">Streamlit (main.py)</text>
    <line x1="225" y1="34" x2="225" y2="400" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- P3: Local JSON -->
    <rect x="330" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="395" y="22" text-anchor="middle">portfolio_data.json</text>
    <line x1="395" y1="34" x2="395" y2="400" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- P4: GitHub REST API -->
    <rect x="500" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="565" y="22" text-anchor="middle">GitHub REST API</text>
    <line x1="565" y1="34" x2="565" y2="400" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- P5: Render Bot Repo -->
    <rect x="670" y="0" width="130" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="735" y="22" text-anchor="middle">Render.com Bot</text>
    <line x1="735" y1="34" x2="735" y2="400" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- P6: Telegram Client -->
    <rect x="830" y="0" width="120" height="34" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="890" y="22" text-anchor="middle">Telegram App</text>
    <line x1="890" y1="34" x2="890" y2="400" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Sequence Arrows & Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
    <!-- 1. Place Order -->
    <line x1="95" y1="140" x2="260" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="177" y="132" text-anchor="middle">1. Place BUY/SELL Order</text>

    <!-- 2. Save Portfolio -->
    <line x1="265" y1="180" x2="430" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="347" y="172" text-anchor="middle">2. save_portfolio()</text>

    <!-- 3. Hash Check & Push -->
    <line x1="265" y1="220" x2="600" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="432" y="212" text-anchor="middle">3. auto_sync_telegram() [PUT holdings.json]</text>

    <!-- 4. GitHub Commits -->
    <line x1="605" y1="260" x2="770" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="687" y="252" text-anchor="middle">4. Webhook / Auto-Deploy</text>

    <!-- 5. User checks telegram -->
    <line x1="930" y1="300" x2="775" y2="300" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="852" y="292" text-anchor="middle" fill="#86efac">5. User sends /portfolio</text>

    <!-- 6. Bot queries yfinance & responds -->
    <line x1="775" y1="340" x2="930" y2="340" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="852" y="332" text-anchor="middle" fill="#86efac">6. Returns live formatted report</text>
  </g>

  <!-- Summary badge -->
  <rect x="180" y="445" width="640" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="471" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    Zero blocking: If GitHub sync fails or GITHUB_TOKEN is omitted, trade execution remains uninterrupted.
  </text>
</svg>