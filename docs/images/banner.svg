<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="80" y1="240" x2="1120" y2="240" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="4,4"/>
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#334155" stroke-opacity="0.2" stroke-dasharray="4,4"/>

  <!-- Brand Emblem -->
  <g transform="translate(100, 110)">
    <rect width="84" height="84" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M42 20 L64 36 L52 64 L32 64 L20 36 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="42" cy="42" r="6" fill="#3b82f6"/>
  </g>

  <!-- Title & Typography -->
  <text x="210" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">FintechHub</text>
  <text x="210" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="url(#blueGrad)">Stock Market Visualization &amp; Portfolio Intelligence Platform</text>
  <text x="210" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Real-time Indian equities analysis, virtual trading simulation, technical screening &amp; cloud portfolio sync</text>

  <!-- Divider Line -->
  <rect x="100" y="270" width="1000" height="2" fill="url(#accentLine)"/>

  <!-- Badges / Tags -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">STREAMLIT 1.40+</text>

    <rect x="145" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="205" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">PYTHON 3.11</text>

    <rect x="280" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="345" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">YAHOO FINANCE</text>

    <rect x="425" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="500" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">TELEGRAM BOT SYNC</text>

    <rect x="590" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="655" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">PAPER TRADING</text>
  </g>
</svg>