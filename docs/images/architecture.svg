<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="620" rx="12" fill="#0b1120"/>
  <rect x="1" y="1" width="998" height="618" rx="11" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <text x="500" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">FintechHub Layered System Architecture</text>
  <text x="500" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Component breakdown from client browser to backend APIs and persistence</text>

  <!-- Layer 1: Client Presentation -->
  <rect x="50" y="90" width="900" height="90" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
  <path d="M50 98 Q50 90 58 90 L942 90 Q950 90 950 98 L950 116 L50 116 Z" fill="url(#headerGrad)"/>
  <text x="65" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">PRESENTATION &amp; CLIENT INTERFACE LAYER (Streamlit + Vanilla JS / CSS)</text>
  <g transform="translate(65, 128)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="0" y="0" width="130" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="24" text-anchor="middle">Dashboard (Home)</text>
    <rect x="145" y="0" width="130" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="210" y="24" text-anchor="middle">Watchlist &amp; Screener</text>
    <rect x="290" y="0" width="130" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="355" y="24" text-anchor="middle">Portfolio &amp; Risk</text>
    <rect x="435" y="0" width="130" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="500" y="24" text-anchor="middle">Orders &amp; Balance</text>
    <rect x="580" y="0" width="130" height="40" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="645" y="24" text-anchor="middle">5 Sector Deep-Dives</text>
    <rect x="725" y="0" width="145" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="797" y="24" text-anchor="middle">Ctrl+K Command Palette</text>
  </g>

  <!-- Layer 2: Application Controller -->
  <rect x="50" y="205" width="900" height="85" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
  <path d="M50 213 Q50 205 58 205 L942 205 Q950 205 950 213 L950 231 L50 231 Z" fill="#1e3a8a"/>
  <text x="65" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">APPLICATION ROUTING &amp; STATE ENGINE (main.py + patches.py)</text>
  <g transform="translate(65, 240)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="0" y="0" width="200" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="100" y="23" text-anchor="middle">Bcrypt Session Auth Guard</text>
    <rect x="220" y="0" width="200" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="320" y="23" text-anchor="middle">Trading Engine &amp; Quick Add</text>
    <rect x="440" y="0" width="200" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="540" y="23" text-anchor="middle">Market Hours &amp; Holiday Patch</text>
    <rect x="660" y="0" width="210" height="38" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="765" y="23" text-anchor="middle">Auto Sync Manager</text>
  </g>

  <!-- Layer 3: Domain Utilities -->
  <rect x="50" y="315" width="900" height="90" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
  <path d="M50 323 Q50 315 58 315 L942 315 Q950 315 950 323 L950 341 L50 341 Z" fill="#0f766e"/>
  <text x="65" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ANALYTICS, RESOLUTION &amp; COMPUTATION LAYER (utils/)</text>
  <g transform="translate(65, 350)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="65" y="20" text-anchor="middle">data_fetcher.py</text>
    <text x="65" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">yfinance ingestion</text>
    <rect x="145" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="210" y="20" text-anchor="middle">stock_resolver.py</text>
    <text x="210" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">NSE/BSE ticker match</text>
    <rect x="290" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="355" y="20" text-anchor="middle">analytics.py</text>
    <text x="355" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">RSI, MACD, BB, SMA</text>
    <rect x="435" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="500" y="20" text-anchor="middle">visualizations.py</text>
    <text x="500" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">Plotly &amp; SVG builders</text>
    <rect x="580" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="645" y="20" text-anchor="middle">ml_predictor.py</text>
    <text x="645" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">Ridge Regression</text>
    <rect x="725" y="0" width="145" height="42" rx="6" fill="#0f172a" stroke="#14b8a6"/>
    <text x="797" y="20" text-anchor="middle">sentiment.py</text>
    <text x="797" y="34" text-anchor="middle" font-size="9" fill="#94a3b8">Claude API / Heuristic</text>
  </g>

  <!-- Layer 4: Storage & External Integrations -->
  <rect x="50" y="430" width="900" height="150" rx="8" fill="url(#boxBg)" stroke="#334155" stroke-width="1.5"/>
  <path d="M50 438 Q50 430 58 430 L942 430 Q950 430 950 438 L950 456 L50 456 Z" fill="#4338ca"/>
  <text x="65" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">PERSISTENCE, SECRETS &amp; EXTERNAL INTEGRATIONS</text>
  
  <g transform="translate(65, 470)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">
    <!-- Local Files -->
    <rect x="0" y="0" width="260" height="92" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="130" y="22" text-anchor="middle" font-weight="700" fill="#a5b4fc">Local JSON Storage</text>
    <text x="130" y="42" text-anchor="middle" font-size="10" fill="#cbd5e1">portfolio_data.json (trades, balance)</text>
    <text x="130" y="60" text-anchor="middle" font-size="10" fill="#cbd5e1">holdings.json (ticker qty/avg)</text>
    <text x="130" y="78" text-anchor="middle" font-size="10" fill="#cbd5e1">user_preferences.json (UI configs)</text>

    <!-- Yahoo Finance -->
    <rect x="280" y="0" width="180" height="92" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="370" y="26" text-anchor="middle" font-weight="700" fill="#a5b4fc">Yahoo Finance</text>
    <text x="370" y="48" text-anchor="middle" font-size="10" fill="#cbd5e1">Historical OHLCV Bars</text>
    <text x="370" y="66" text-anchor="middle" font-size="10" fill="#cbd5e1">fast_info LTP &amp; Prev Close</text>

    <!-- GitHub Sync & Telegram Pipeline -->
    <rect x="480" y="0" width="390" height="92" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="675" y="22" text-anchor="middle" font-weight="700" fill="#a5b4fc">Telegram Bot Automated Synchronization Pipeline</text>
    <text x="540" y="48" text-anchor="middle" font-size="10" fill="#93c5fd">GitHub REST API</text>
    <text x="615" y="48" font-size="10" fill="#64748b">→</text>
    <text x="680" y="48" text-anchor="middle" font-size="10" fill="#93c5fd">telegram-portfolio-bot</text>
    <text x="755" y="48" font-size="10" fill="#64748b">→</text>
    <text x="815" y="48" text-anchor="middle" font-size="10" fill="#93c5fd">Render.com</text>
    <text x="675" y="74" text-anchor="middle" font-size="10" fill="#cbd5e1">Pushes holdings.json · Webhook receiver answers /portfolio in Telegram</text>
  </g>
</svg>